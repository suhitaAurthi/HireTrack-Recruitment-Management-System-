# Application Configuration
spring.application.name=recruitment-management-system
server.port=8080

# Default Datasource Configuration (PostgreSQL with environment fallback, H2 default if absent)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:rmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
